[project]
name = "gaming-neutrality"
version = "0.1.0"
description = "Measuring whether LLMs behave more neutral when they detect an evaluation context"
requires-python = ">=3.11"

# Pinned to the versions the results were produced with. Loosen deliberately,
# not incidentally: analysis output should stay reproducible across machines.
dependencies = [
    "anthropic==0.120.2",
    "openai==2.53.0",
    "google-genai==2.17.0",
    "tenacity==9.1.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "pandas==3.0.5",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "pingouin==0.6.1",
    "tqdm==4.70.0",
]

[tool.uv]
# Scripts are run from the repo (python src/models.py), not installed.
package = false
